<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>BankCore - Withdraw</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
        }

        .navbar {
            background: #1565c0;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 430px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .account-info {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .account-info p {
            margin: 8px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #c62828;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1565c0;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>🏦 BankCore</h2>

    <a href="/dashboard">
        Dashboard
    </a>

</div>

<div class="container">

    <h1>Withdraw Money</h1>

    <div class="account-info">

        <p>
            <strong>Account Number:</strong>
            <span th:text="${account.accountNumber}">
                100000000000
            </span>
        </p>

        <p>
            <strong>Current Balance:</strong>
            ₹ <span th:text="${account.balance}">
                0.00
            </span>
        </p>

    </div>

    <form th:action="@{/transactions/withdraw}" method="post">

        <input type="hidden"
               name="accountId"
               th:value="${account.id}">

        <label for="amount">
            Amount
        </label>

        <input type="number"
               id="amount"
               name="amount"
               min="0.01"
               step="0.01"
               placeholder="Enter withdrawal amount"
               required>

        <button type="submit">
            Withdraw Money
        </button>

    </form>

    <a th:href="@{/transactions(accountId=${account.id})}"
       class="back">
        ← Back to Transactions
    </a>

</div>

</body>
</html>
