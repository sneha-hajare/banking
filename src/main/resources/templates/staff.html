<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #455a64;
            color: white;
            padding: 20px 30px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h2>🏦 BankCore — Staff</h2>
</header>

<div class="container">

    <h1>Staff Dashboard</h1>

    <div class="card">
        <h3>Customer Accounts</h3>
        <p>Manage customer accounts and banking operations.</p>
    </div>

    <div class="card">
        <h3>Loan Applications</h3>
        <p>Review and process customer loan applications.</p>
    </div>

    <div class="card">
        <h3>Transactions</h3>
        <p>Monitor banking transactions.</p>
    </div>

</div>

</body>
</html>
