<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pending Loans</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .approve {
            background: #198754;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .approve:hover {
            background: #146c43;
        }

        .reject:hover {
            background: #b02a37;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Pending Loan Applications</h2>

    <div th:if="${#lists.isEmpty(loans)}" class="empty">
        <p>No pending loan applications.</p>
    </div>

    <table th:unless="${#lists.isEmpty(loans)}">

        <thead>
        <tr>
            <th>Account Number</th>
            <th>Loan Type</th>
            <th>Amount</th>
            <th>Interest Rate</th>
            <th>Tenure</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="loan : ${loans}">

            <td th:text="${loan.account.accountNumber}"></td>

            <td th:text="${loan.loanType}"></td>

            <td th:text="${loan.amount}"></td>

            <td th:text="${loan.interestRate + '%'}"></td>

            <td th:text="${loan.tenure + ' months'}"></td>

            <td>

                <form th:action="@{/loans/approve/{id}(id=${loan.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit" class="approve">
                        Approve
                    </button>

                </form>

                <form th:action="@{/loans/reject/{id}(id=${loan.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit" class="reject">
                        Reject
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
