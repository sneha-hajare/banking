<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>BankCore - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            background: #ffe0e0;
            color: #c62828;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>🏦 Create Account</h1>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <label>Full Name</label>

        <input type="text"
               th:field="*{name}"
               placeholder="Enter full name"
               required>

        <label>Email</label>

        <input type="email"
               th:field="*{email}"
               placeholder="Enter email"
               required>

        <label>Phone</label>

        <input type="text"
               th:field="*{phone}"
               placeholder="Enter phone number"
               required>

        <label>Password</label>

        <input type="password"
               th:field="*{password}"
               placeholder="Create password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login">
        Already registered?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
