<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #263238;
            color: white;
            padding: 20px 30px;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h2>🏦 BankCore — Administration</h2>
</header>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>👥 Users</h3>
            <p>Manage customers and staff.</p>
        </div>

        <div class="card">
            <h3>🏦 Accounts</h3>
            <p>Manage all bank accounts.</p>
        </div>

        <div class="card">
            <h3>💰 Transactions</h3>
            <p>Monitor transactions.</p>
        </div>

        <div class="card">
            <h3>📊 Reports</h3>
            <p>View banking reports and analytics.</p>
        </div>

    </div>

</div>

</body>
</html>
